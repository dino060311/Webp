<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 소개</title>
    <style>
        body {
            background-color: #8dc6ff;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h3 onmouseover="document.getElementById('photo').style.display='block'" 
        onmouseout="document.getElementById('photo').style.display='none'">
        현지
    </h3>
    
    <hr>
    
    <img id="photo" src="image.png" alt="내 사진" style="display: none; width: 150px;">
    
    <p>
        안녕하세요 저는 소프트웨어학과를 재학중입니다. 자바프로그래밍이랑 웹 프로그래밍을 배우고 있습니다.
    </p>

</body>
</html>
